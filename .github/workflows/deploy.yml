name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # `npm ci` respects the lockfile, so a deploy cannot silently pick up a
      # different dependency tree than the one CI verified.
      - name: Install dependencies
        run: npm ci

      # Never publish a build that does not typecheck or pass its tests. The
      # deploy used to run straight from a push with no gate at all.
      - name: Verify
        run: npm run check

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build static assets
        run: npm run build:gh-pages
        env:
          # base_url is the full site URL and is correct for custom domains,
          # user pages and project pages alike. base_path is kept as a fallback.
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Optional Cloudflare Worker proxy (see worker/README.md). Set it as a
          # repository *variable* to make the proxy toggle work in production;
          # when unset the UI reports the proxy as unavailable rather than
          # offering a control that cannot work.
          VITE_PROXY_URL: ${{ vars.VITE_PROXY_URL }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
